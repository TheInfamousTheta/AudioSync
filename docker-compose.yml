version: '3.8'

services:
  jiosaavn-api:
    build:
      context: https://github.com/sumitkolhe/jiosaavn-api.git#main
    ports:
      - "3000:3000"
    restart: always

  backend:
    image: ghcr.io/theinfamoustheta/audio-sync-backend:latest
    ports:
      - "4000:4000"
    volumes:
      - sqlite_data:/app/data
    env_file:
      - .env
    environment:
      - PORT=4000
      - SAAVN_API_URL=http://jiosaavn-api:3000
      - DATABASE_PATH=/app/data/db.sqlite
    depends_on:
      - jiosaavn-api
    restart: always

volumes:
  sqlite_data:
